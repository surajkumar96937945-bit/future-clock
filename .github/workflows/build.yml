name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android scaffolding
        run: flutter create --platforms=android --project-name=future_clock .

      - name: Setup App Icon
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Set App Name to F_clock
        run: sed -i 's/android:label="future_clock"/android:label="F_clock"/g' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F_clock-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
